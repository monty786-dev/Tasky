name: build
on: [push, pull_request]

jobs:
  wine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis
      - name: cross-compile
        run: |
          mkdir -p build
          x86_64-w64-mingw32-gcc -O2 -municode -o build/Win32Bridge.exe Win32Bridge.c -lws2_32 -luser32 -lgdi32
          x86_64-w64-mingw32-gcc -O2 -municode -o build/WindowLookChanger.exe wlc.c -lws2_32 -lcomdlg32 -lshell32 -lgdi32 -luser32 -ladvapi32
      - name: installer
        run: makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: WLC-Taskbar
          path: |
            build/*.exe
            WLC-Taskbar-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-apk
          path: android/app/build/outputs/apk/debug/*.apk
