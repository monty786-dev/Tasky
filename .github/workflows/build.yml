name: Build C App & Modern Setup.exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to click "Run workflow" manually on GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 (C Compiler)
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Compile C Application
        shell: cmd
        run: |
          mkdir build
          gcc src/main.c -o build/WinlatorShell.exe -mwindows -lgdi32 -lgdiplus -luser32 -lshell32 -lcomctl32 -ldwmapi -luxtheme -O2

      - name: Compile Setup.exe with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Setup.exe to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorShell-Installer
          path: Output/WinlatorShell_Setup.exe
