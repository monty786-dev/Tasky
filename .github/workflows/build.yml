name: Build Winlator Shell & Setup.exe

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 C Compiler
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Compile C Application (main.c + config.h)
        shell: cmd
        run: |
          if not exist build mkdir build
          gcc src/main.c -o build/WinlatorShell.exe -mwindows -lgdi32 -luser32 -lshell32 -lcomctl32 -lcomdlg32 -ladvapi32 -O2

      - name: Build Modern Setup.exe with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload WinlatorShell_Setup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorShell-Setup
          path: Output/WinlatorShell_Setup.exe
